# Cloud AI Trader — local Docker deployment (owner decision, 2026-07-26):
# runs on THIS Mac, replacing the LaunchAgent-managed processes — not a
# remote server. Broker credentials (Dhan Client ID/Token) are NEVER passed
# here — they go in via the Settings UI at runtime and live in
# state.credentials (in-process memory only), same as the non-Docker
# deployment. backend/.env carries only non-broker config (Supabase, app
# password, Gemini/Anthropic key, capital/risk defaults) — see
# backend/.env.example.
#
# Bind-mounts backend/data (not a named volume) so the black-box history
# already on disk from months of testing continues, rather than starting a
# Docker-managed volume from empty.
#
# Usage: docker compose up -d --build

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        # MUST be a build arg, not `environment:` below — verified live
        # 2026-07-26: next.config.mjs's rewrites() is evaluated at `next
        # build` time and frozen into the routing manifest, not re-read when
        # the standalone server starts. A runtime-only BACKEND_URL silently
        # had no effect (proxy kept using the http://localhost:8000 default
        # baked in at build time, logging ECONNREFUSED).
        BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost — this compose-level healthcheck OVERRIDES
      # the Dockerfile's own HEALTHCHECK entirely (compose wins when both
      # exist); fixing only the Dockerfile copy earlier had no effect, which
      # is what actually cost the time here, not a build-cache problem.
      # Alpine/musl resolves "localhost" to ::1 first; Next.js binds IPv4 only.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
