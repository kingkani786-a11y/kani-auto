# Cloud AI Trader — CI (owner, 2026-07-26, Phase 2: "CI only, Deploy is a
# later phase"). Build + Lint + Docker Build + Smoke Test on every push/PR.
#
# Deliberately does NOT deploy anything — no SSH step, no `docker compose up`
# against a real server, no registry push. That is Phase 4, gated on Sentry
# (Phase 3) landing first and on an explicit manual-approval step being added
# — per the owner's own Production Safety Rule: "Never Deploy Automatically."
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          # commented out in requirements.txt as "optional" (repo convention:
          # install only the provider you use) but this deployment runs
          # CAT_AI_PROVIDER=gemini live — same reasoning as the Dockerfile.
          pip install "google-genai>=1.0"
          pip install ruff

      - name: Syntax check
        working-directory: backend
        run: python -m compileall -q app

      - name: Lint (ruff)
        working-directory: backend
        # No linter was configured in this repo before now — ruff added here
        # is CI-only tooling (not in requirements.txt, doesn't touch runtime).
        # continue-on-error until an initial pass has been reviewed, so this
        # workflow doesn't start red on pre-existing style issues nobody has
        # triaged yet; tighten to a hard failure once that pass is done.
        run: ruff check app --output-format=github
        continue-on-error: true

      - name: Import check
        working-directory: backend
        env:
          CAT_RESEARCH_MODE: "1"
        run: python -c "import app.main; print('backend import OK')"

  frontend:
    name: Frontend — build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        # ESLint was never configured in this project before 2026-07-26 (no
        # eslint/eslint-config-next dependency, no config file existed).
        # Bootstrapped it this pass, but hit a real ESLint 9 / eslint-config-
        # next compatibility bug: a circular reference inside the plugin
        # config graph (eslint-plugin-react's flat config self-references),
        # thrown from @eslint/eslintrc's config validator — not a fix I could
        # resolve by adjusting my own config, and not worth open-ended
        # version-pinning archaeology inside this pass. continue-on-error
        # until that's untangled (or the ecosystem's flat-config transition
        # settles) — never silently green, never blocking the pipeline either.
        run: npm run lint
        continue-on-error: true

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-smoke-test:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # smoke-test.sh runs `git rev-parse --short HEAD`

      - name: Run smoke test
        # No BACKEND_PORT/FRONTEND_PORT set — CI runners are single-tenant,
        # the defaults (8000/3000) are fine; that env-var override exists for
        # running side-by-side with an already-running deployment on a dev
        # machine, which doesn't apply here.
        run: ./scripts/smoke-test.sh
